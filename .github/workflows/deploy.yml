name: Create output

on:
  push:
    branches: [ "main" ]

env:
  STORAGE_PATH: output/

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Run tests
      run: cargo test
    - name: Compile and run
      run: cargo run --release
    - name: Create tarball
      run: tar vcf output.tar output/
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: output.tar
        path: ./output.tar
